<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="background">
        <div class="nav">
            <a class="a active" href="#" data-target="home">HOME</a>
            <a class="b" href="#" data-target="aboutme">ABOUT ME</a>
            <a class="c" href="#" data-target="gallery">GALLERY</a>
            <a class="d" href="#" data-target="contactme">CONTACT ME</a>
        </div>
        <div class="content">
            <div class="home content-section active" data-section="home">
                <h1>I am Tomoya</h1>
                <h3>Web Engineer</h3>
            </div>
            <div class="aboutme content-section" data-section="aboutme">
                <p><b>神奈川出身の22歳</b></p>
                <p>今年社会人になりました。</p>
                <p>使用している言語は主にPHP->Laravel、JS->JQuery,Vue</p>
                <p>趣味程度にPythonに触れています。</p>
                <p>趣味は旅行、読書、物づくりです。</p>
            </div>
            <div class="gallery content-section" data-section="gallery">
                <div class="image">
                    <img class="photo" src="images/IMG_1192.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3260.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3290.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3549.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4009.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4049.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4110.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4127.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4144.jpg" alt="カメラ">
                </div>
            </div>
            <div class="contactme content-section" data-section="contactme">
                <div class="contactform">
                    <form action="index.html" method="POST">
                        <input type="text" name="" value="" class="inputtext" placeholder="First Name">
                        <input type="text" name="" value="" class="inputtext" placeholder="Last Name">
                        <input type="text" name="" value="" class="inputtext" placeholder="Your Email">
                        <textarea name="" id="" cols="4" rows="6" class="inputmessage" placeholder="Your Message...!!"></textarea>
                        <input type="button" name="" class="submitbutton" value="Submit">
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav a');
            const contentSections = document.querySelectorAll('.content-section');
            
            function showSection(targetSection) {
                contentSections.forEach(section => {
                    if (section.dataset.section === targetSection) {
                        section.style.display = 'block';
                        setTimeout(() => {
                            section.classList.add('active');
                        }, 10);
                    } else {
                        section.classList.remove('active');
                        setTimeout(() => {
                            section.style.display = 'none';
                        }, 400);
                    }
                });
            }
            
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    navLinks.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    
                    const targetSection = this.dataset.target;
                    showSection(targetSection);
                });
            });
        });
    </script>
</html>
