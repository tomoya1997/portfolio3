<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>

<body>
    <div class="background">
        <div class="nav">
            <a class="a active" href="#">HOME</a>
            <a class="b" href="#">ABOUT ME</a>
            <a class="c" href="#">GALLERY</a>
            <a class="d" href="#">CONTACT ME</a>
        </div>
        <div class="content">
            <div class="home">
                <h1>I am Tomoya</h1>
                <h3>Web Engineer</h3>
            </div>
            <div class="aboutme">
                <p><b>神奈川出身の22歳</b></p>
                <p>今年社会人になりました。</p>
                <p>使用している言語は主にPHP->Laravel、JS->JQuery,Vue</p>
                <p>趣味程度にPythonに触れています。</p>
                <p>趣味は旅行、読書、物づくりです。</p>
            </div>
            <div class="gallery">
                <div class="image">
                    <img class="photo" src="images/IMG_1192.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3260.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3290.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_3549.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4009.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4049.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4110.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4127.jpg" alt="カメラ">
                </div>
                <div class="image">
                        <img class="photo" src="images/IMG_4144.jpg" alt="カメラ">
                </div>
            </div>
            <div class="contactme">
                <div class="contactform">
                    <form>
                        <input type="text" name="firstName" class="inputtext" placeholder="First Name" required>
                        <input type="text" name="lastName" class="inputtext" placeholder="Last Name" required>
                        <input type="email" name="email" class="inputtext" placeholder="Your Email" required>
                        <textarea name="message" cols="4" rows="6" class="inputmessage" placeholder="Your Message...!!" required></textarea>
                        <input type="submit" class="submitbutton" value="Submit">
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</html>
